name: ingest & deploy

on:
  schedule:
    # Every 3 hours. GitHub queues rather than guarantees this time.
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # committing the refreshed feed
  pages: write
  id-token: write

# A manual run overlapping the cron would double-fetch and, once the Phase 4
# budget ledger exists, read the same ledger twice and double-spend.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only refresh the feed on a schedule or a manual run. A code push should
      # deploy what is already committed — ingesting on every push burns the
      # Guardian daily quota and is what made two runs race to commit.
      - name: Ingest
        if: github.event_name != 'push'
        env:
          GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: npm run ingest

      - name: Commit refreshed feed
        if: github.event_name != 'push'
        run: |
          git config user.name "nietok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feed.json

          if git diff --staged --quiet; then
            echo "feed unchanged — nothing to commit"
            exit 0
          fi

          git commit -m "chore(feed): refresh $(date -u +%Y-%m-%dT%H:%MZ)"

          # Rebase-and-retry. Even with a concurrency group, a manual run can
          # land alongside the cron; losing the commit silently would drift the
          # deployed feed from the repo, so this retries rather than ignoring it.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main
          done

          echo "::error::could not push the refreshed feed after 3 attempts"
          exit 1

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
