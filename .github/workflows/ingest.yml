name: ingest & deploy

on:
  schedule:
    # Every 3 hours. GitHub queues rather than guarantees this time.
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Two runs ingesting at once would waste API quota and, once the Phase 4 budget
# ledger exists, read the same ledger twice and double-spend.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generated feed is data, not source, so it is cached rather than
      # committed. Committing ~2.3 MB every three hours would add roughly a
      # gigabyte of git history a year, and the commit-and-push was itself what
      # made concurrent runs race each other.
      #
      # The restore is only for continuity: it carries firstSeen timestamps and
      # cards whose source has since dropped them. A cache miss costs nothing
      # but a feed rebuilt purely from what the APIs return right now.
      - name: Restore previous feed
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data
            .wiki-cache
          key: feed-${{ github.run_id }}
          restore-keys: |
            feed-

      # Natural Earth country outlines. Built only when the cache did not carry
      # it — the source is a 700KB download and the geometry never changes.
      - name: Build world map if missing
        run: |
          if [ -f public/data/world.json ]; then
            echo "world.json restored from cache"
          else
            npm run build:world
          fi

      - name: Ingest
        env:
          GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          # Absent secret means enrichment is skipped, not that the run fails.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The ledger in public/data is carried by the Actions cache. If that
          # cache is ever evicted the ledger resets to zero, which is why the
          # Anthropic Console spend limit — not this file — is the real cap.
          LLM_MONTHLY_CAP_USD: '2.20'
        run: npm run ingest

      - name: Save feed for the next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            public/data
            .wiki-cache
          key: feed-${{ github.run_id }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
